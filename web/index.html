<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cloud-pulse</title>
  <link rel="stylesheet" href="/assets/vendor/uplot/uPlot.min.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <a class="cp-skip-link" href="#cp-main">Skip to main content</a>

  <noscript>
    <div class="cp-noscript-banner">
      cloud-pulse requires JavaScript to render the dashboard. Please enable
      JavaScript, or use the JSON API directly at
      <code>/api/v1/hosts</code>.
    </div>
  </noscript>

  <header class="cp-header">
    <div class="cp-header-inner">
      <span class="cp-brand">cloud-pulse</span>
      <nav aria-label="Primary">
        <a href="#/">Overview</a>
        <a href="#/settings">Settings</a>
      </nav>
    </div>
  </header>

  <div id="cp-update-banner-host" class="cp-banner-host"></div>
  <div id="cp-banner-host" class="cp-banner-host"></div>

  <main id="cp-main" class="cp-main" tabindex="-1">
    <!-- Rendered by assets/js/main.js -->
  </main>

  <footer class="cp-footer">
    <p id="cp-refresh-indicator" class="cp-refresh-indicator">Loading…</p>
    <p id="cp-live-region" class="cp-sr-only" role="status" aria-live="polite"></p>
  </footer>

  <dialog id="cp-token-dialog" class="cp-dialog" aria-labelledby="cp-token-dialog-title">
    <form id="cp-token-form" method="dialog">
      <h2 id="cp-token-dialog-title">Authentication required</h2>
      <p>Enter the UI access token configured on this hub (<code>CP_UI_TOKEN</code>).</p>
      <label for="cp-token-input">Access token</label>
      <input id="cp-token-input" name="token" type="password" autocomplete="off" required>
      <p id="cp-token-error" class="cp-dialog-error" role="alert"></p>
      <div class="cp-dialog-actions">
        <button type="button" id="cp-token-cancel" value="cancel">Cancel</button>
        <button type="submit" value="submit">Continue</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
